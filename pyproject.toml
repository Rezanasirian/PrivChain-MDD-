[project]
name = "privchain-mdd"
version = "0.0.0"
description = "Depression Detection via Multimodal Federated Learning, Per-Modality Differential Privacy, and Blockchain Auditability (PrivChain-MDD)"
authors = [{ name = "Reza Nasirian", email = "rezanasirian18@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — University of Tehran thesis project" }

# Core dependencies needed from Phase 0 onward (kept light so the mock-data
# smoke test installs quickly). Heavy, phase-specific ML libraries live in the
# optional-dependency groups below and are pulled in only when that phase starts.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.2",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    # Phase 3 (H1): RDP accounting and per-sample gradients. Core, not optional —
    # every epsilon reported in Chapter 4 comes from Opacus (ADR-0004).
    "opacus>=1.4",
]

[project.optional-dependencies]
# Phase 1 — multimodal encoders
audio = ["librosa>=0.10"]
nlp = ["transformers>=4.40"]
ml = ["scikit-learn>=1.4"]
# Phase 2/4 — federated orchestration
federated = ["flwr>=1.8"]
# Phase 7 — evaluation plots (inference-latency figure); harness degrades
# gracefully to JSON-only when this is not installed.
viz = ["matplotlib>=3.8"]
# Developer tooling (lint, types, tests, hooks)
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/privchain"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pep8-naming, pyupgrade, bugbear, docstrings
select = ["E", "F", "I", "N", "UP", "B", "D"]
ignore = [
    "D203", # one-blank-line-before-class (conflicts with D211)
    "D213", # multi-line-summary-second-line (conflicts with D212)
    "D107", # __init__ docstring — args are documented in the class docstring
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]          # docstrings not required in tests
"scripts/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
# 3.12 matches the development/runtime interpreter; required so the bundled
# numpy 2.x stubs (which use 3.12-only `type` statements) parse under mypy.
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party libs without type stubs — don't fail strict mode on them.
module = ["yaml", "librosa.*", "transformers.*", "opacus.*", "flwr.*", "sklearn.*", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `flwr` is optional: with it installed `NumPyClient` is a real class, without it
# the base is `Any` and subclassing it needs a `type: ignore[misc]`. Keep the
# ignore (needed in the uninstalled case) without failing in the installed one.
module = ["privchain.federated.flower_app"]
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# `src` so the package imports without an editable install; `.` so the shared
# fixtures under `tests/fixtures/` import as `tests.fixtures` whichever way
# pytest is invoked. Without the second entry, a bare `pytest` run fails at
# collection ("No module named 'tests'") while `python -m pytest` succeeds,
# because only the latter puts the working directory on sys.path.
pythonpath = ["src", "."]
addopts = "-ra"
markers = [
    "integration: end-to-end pipeline tests (may be slower)",
]
