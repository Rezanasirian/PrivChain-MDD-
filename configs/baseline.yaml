# Baseline / centralized configuration (Phases 0–1).
# No hyperparameter may be hardcoded in source — everything lives here.

# Global reproducibility seed (seeds torch, numpy, random). See CLAUDE.md §3.
seed: 42

# ── Mock DAIC-WOZ data (Phase 0) ─────────────────────────────────────────────
# Synthetic stand-in for the access-controlled DAIC-WOZ dataset so the full
# pipeline can be exercised without real data. Shapes mirror the real modalities.
data:
  num_sessions: 32          # number of synthetic interview sessions
  root: data/mock           # where `generate_mock_data.py` writes mock files

  # PHQ-8 depression score range and binary cutoff (DAIC-WOZ convention: >= 10).
  phq8_max: 24
  depression_cutoff: 10

  audio:
    # Log-mel acoustic features: (num_frames, n_mels) per session.
    n_mels: 40
    min_frames: 80
    max_frames: 200
  video:
    # Facial features (e.g., OpenFace landmarks/AUs): (num_frames, n_features).
    n_features: 49
    min_frames: 40
    max_frames: 100
  text:
    # Transcript token embeddings: (num_tokens, embed_dim) per session.
    embed_dim: 64
    min_tokens: 20
    max_tokens: 60

# ── Model (Phase 1: centralized multimodal baseline) ─────────────────────────
# Per-modality input dims are NOT set here — they are derived from the `data`
# section above (audio.n_mels / video.n_features / text.embed_dim), so the same
# model config works for mock and real DAIC-WOZ features.
model:
  # encode_then_fuse: pool each modality to one session vector, then fuse (the
  #   committed Phase 1 model).
  # segment_gated: cut the interview into aligned segments, fuse the modalities
  #   per segment under a quality-aware gate, then pool the segments by attention
  #   (ADR-0027). Requires daic_woz.segments.enabled.
  architecture: encode_then_fuse
  encoder:
    # stats: AVEC2017-style session functionals + MLP. The default for real data —
    #        a GRU over ~3000 timesteps does not fit on 107 sessions (ADR-0012).
    # mean | gru: projection+mean-pool, or bidirectional DPGRU.
    type: stats
    # Swept over lr x hidden x dropout, 3 seeds each, on transformer text
    # features (ADR-0014). This point ties for best mean dev F1 and was the most
    # stable — identical F1 across all three seeds — which matters because every
    # later phase re-runs this model many times.
    hidden_dim: 128
    out_dim: 128
    bidirectional: true  # only read by the `gru` encoder
    dropout: 0.3         # small dataset: regularize harder than the mock default

  # Text arrives as one document-level embedding, i.e. a length-1 "sequence".
  # Session functionals are degenerate there (mean = min = max = the vector,
  # std = delta = 0), so `stats` would quintuple the text encoder's parameters
  # for no extra information. A plain projection is the right pooling. ADR-0014.
  encoder_overrides:
    text:
      type: mean
  fusion:
    type: concat         # concatenate per-modality embeddings
    hidden_dim: 128
    dropout: 0.1
  head:
    hidden_dim: 64
    dropout: 0.1
  # Session-level pooling over the fused segment sequence. Only read by the
  # `segment_gated` architecture.
  temporal:
    attention_dim: 64
    positional: true         # let the pooler use *where* in the interview a segment sat
    dropout: 0.1

  # ── Capability-conditioned logit MoE (ADR-0028) ─────────────────────────────
  # Only read when model.architecture is capability_moe.
  moe:
    # Where the mixture starts, NOT a hyperparameter to sweep. The ADR-0027
    # ladder measured segment text alone at 0.774 ROC-AUC against 0.638 with
    # session audio/video beside it, so the gate begins at roughly
    # 0.79 text / 0.11 audio / 0.11 video instead of a uniform prior the
    # optimizer would have to unlearn on 107 participants. Derived from the
    # train split only; recorded in every run manifest as `gate_bias_swept:
    # false`. Sweeping it would turn a recorded prior into a selected one.
    gate_bias:
      audio: 0.0
      video: 0.0
      text: 2.0
    gate_hidden_dim: 32

  use_phq_regression: true   # auxiliary PHQ-8 score regression alongside the binary head
  phq_loss_weight: 0.1       # weight of the (normalized) PHQ-8 regression term
  # mse | huber. Huber resists the single participant scoring 24 dominating the
  # gradient on 107 sessions.
  phq_loss: mse
  # IN NORMALIZED UNITS: the target is phq8_score / phq8_max, so 0.1 is about
  # 2.4 PHQ-8 points. A delta of 1.0 is quadratic everywhere, i.e. plain MSE.
  huber_delta: 0.1

# ── Training (Phase 1: centralized, no federation, no privacy) ───────────────
train:
  # 107 real training sessions; 32 gives ~4 steps/epoch and keeps the GPU busy
  # on the long (3000-step) sequences without starving gradient updates.
  batch_size: 32
  epochs: 200                # upper bound; early stopping usually ends sooner
  learning_rate: 0.0003      # swept; see ADR-0014
  weight_decay: 0.0001
  # Only used when no dedicated validation set is supplied (i.e. mock runs).
  # Real DAIC-WOZ runs validate on the official dev split — see ADR-0011.
  val_fraction: 0.25
  num_workers: 0
  output_dir: experiments
  run_name: phase1_centralized_baseline

  # DAIC-WOZ is ~28% positive; without this the BCE loss collapses onto the
  # majority class and F1 is exactly 0. The weight (neg/pos) is counted from
  # the training split at runtime, not hardcoded here.
  class_weighting: true

  # Model selection + early stopping. F1 is the headline DAIC-WOZ/AVEC2017
  # metric, and selecting on ROC-AUC was actively harmful here: it kept picking
  # epoch 1, whose F1 was 0, and stopped the run before the loss had converged
  # (ADR-0012). Patience is generous because dev has only 34 sessions, so the
  # per-epoch metric is noisy.
  selection_metric: f1
  early_stopping_patience: 40

  device: auto               # auto | cpu | cuda

  # Evaluation protocol (ADR-0015). The epoch and the decision threshold are
  # chosen on a slice carved out of train; the dev split is reported on and
  # never selected against. Every arm in the Chapter-4 comparison uses this.
  selection_fraction: 0.2
  seeds: [42, 7, 2024]

  # Randomly hide modalities during *training* so the centralized model has met
  # the capability mixes it will face in federation (ADR-0027). Fractions must
  # sum to 1; capability vectors are [audio, video, text]. Off by default: the
  # committed Phase 1 numbers are trained on all three modalities.
  modality_dropout:
    enabled: false
    patterns:
      - {name: text_only,  capability: [0, 0, 1], fraction: 0.30}
      - {name: audio_text, capability: [1, 0, 1], fraction: 0.20}
      - {name: video_text, capability: [0, 1, 1], fraction: 0.20}
      - {name: full,       capability: [1, 1, 1], fraction: 0.20}
      - {name: audio_only, capability: [1, 0, 0], fraction: 0.10}
