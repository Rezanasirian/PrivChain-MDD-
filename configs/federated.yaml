# Federated-learning configuration (Phases 2 & 4).

seed: 42

federation:
  num_clients: 10            # assumption (see ADR-0001): >= 10 simulated clients
  # One round with local_epochs=1 is roughly one epoch of data spread over the
  # clients. The centralized baseline needs ~36 epochs to converge (ADR-0012), so
  # the previous budget of 20 rounds starved every federated arm and understated
  # all of them. Early stopping on the selection split means the extra rounds are
  # free when an arm converges sooner (ADR-0021).
  num_rounds: 120
  clients_per_round: 10
  local_epochs: 1
  early_stopping_patience: 40   # matches the centralized baseline's patience

  # How the training split is divided across clients.
  partition:
    mode: iid                 # {iid, dirichlet}
    dirichlet_alpha: 0.5      # only used when mode = dirichlet; smaller = more skew

  # Heterogeneous modality-access patterns across the client population.
  # one-hot capability vector order: [audio, video, text]
  modality_patterns:
    - name: full              # specialized clinic — all three modalities
      capability: [1, 1, 1]
      fraction: 0.4
    - name: audio_text
      capability: [1, 0, 1]
      fraction: 0.3
    - name: audio_only
      capability: [1, 0, 0]
      fraction: 0.2
    - name: text_only
      capability: [0, 0, 1]
      fraction: 0.1

aggregation:
  # Phase 4 (H2): capability_aware groups clients into per-modality subgraphs so a
  # missing modality's zero-imputed gradients never corrupt that encoder. Set to
  # fedavg to reproduce the Phase 2 baseline.
  strategy: capability_aware  # {fedavg, capability_aware}
  reputation_weighting: true  # weight updates by data volume + update consistency
  federated_distillation: true

  reputation:
    volume_weight: 0.5        # alpha: blend of relative data volume vs. consistency
    ema_decay: 0.8            # smoothing of reputation across rounds
    min_reputation: 0.05      # floor so no participating client is fully excluded

  distillation:
    weight: 0.5               # weight of the soft-target (teacher) loss term
    temperature: 2.0          # softening temperature for teacher/student logits
    apply_to: missing_modality  # {missing_modality, all}
    mode: anchor              # {anchor, random, proximal}; ADR-0024
    anchor_batch_size: 16
    anchor_sequence_length: 8
    anchor_optimization_steps: 20
    anchor_learning_rate: 0.05
    anchor_l2_weight: 0.0001
    anchor_diversity_weight: 1.0
    student_steps: 1
