# Real DAIC-WOZ / AVEC2017 data configuration (Phase 1).
#
# Used with: python scripts/train_baseline.py --daic-config configs/daic_woz.yaml
#
# The dataset is access-controlled (Data Use Agreement) and ~300 GB; download
# from https://dcapswoz.ict.usc.edu/ and extract each participant archive so the
# layout below holds. Model input dims are inferred from the real features at
# load time (see DaicWozDataset.feature_dims), so they are NOT set here.
#
# VERIFY the file templates and column names against your actual download before
# trusting results — see docs/architecture/ADR-0002-daic-woz-integration.md.

seed: 42

daic_woz:
  # Root containing per-participant folders (e.g. 300_P/, 301_P/, ...) and the
  # split label CSVs (paths below are resolved relative to this root).
  root: data/daic_woz
  phq8_max: 24

  participant_dir_template: "{pid}_P"

  # Segment-aligned mode (ADR-0027). When enabled, ALL THREE modalities become
  # `count` rows cut at the same places: the participant's turns are grouped into
  # `count` contiguous groups, text is embedded per group, and audio/video
  # functionals are computed over the frames those groups span. Off by default —
  # the committed Phase 1 results use the session-level view above.
  segments:
    enabled: false
    count: 8

  # Parsed/subsampled feature matrices are memoized here (relative to `root`),
  # keyed by the parsing options below so a stride change invalidates them.
  # Re-parsing the ~36 MB COVAREP files on every run cost minutes; set to null
  # to disable. Lives under data/, so it is git-ignored.
  feature_cache_dir: _feature_cache

  splits:
    train: train_split_Depression_AVEC2017.csv
    dev: dev_split_Depression_AVEC2017.csv
    test: full_test_split.csv

  # Default header names (train/dev). Verified against the real corpus
  # downloaded 2026-08-13; see docs/architecture/ADR-0010.
  label_columns:
    participant_id: Participant_ID
    phq_binary: PHQ8_Binary
    phq_score: PHQ8_Score

  # The AVEC2017 test split ships different header names for the same fields
  # (PHQ_* rather than PHQ8_*). Without this override every test label would be
  # missing — the loader now raises instead of silently reading them as 0.
  split_label_columns:
    test:
      participant_id: Participant_ID
      phq_binary: PHQ_Binary
      phq_score: PHQ_Score

  # Participant 440's archive is truncated at source on the USC server (its
  # TRANSCRIPT/COVAREP/FORMANT files are absent from the published zip), so the
  # session has no text or audio modality. Dropped from the dev split; see
  # docs/architecture/ADR-0010.
  exclude_participants: [440]

  # Coverage note (ADR-0011): the loader keeps every `frame_stride`-th frame and
  # stops at `max_frames`, so stride x max_frames must exceed the raw frame count
  # or the tail of the interview is silently discarded. Interviews run ~15 min.
  # The previous 1000x5 setting covered only the first ~50 s of each session.
  # A modality may also read SEVERAL files, concatenated channel-wise and aligned
  # on the source row index (ADR-0031). The corpus ships signals the pipeline
  # never read — OpenFace `gaze`/`pose` beside the action units, and `FORMANT`
  # beside COVAREP — and `sources` is how they join a branch instead of becoming
  # a fourth modality:
  #
  #   video:
  #     sources:
  #       - {file_template: "{pid}_CLNF_AUs.txt"}
  #       - {file_template: "{pid}_CLNF_gaze.txt"}
  #       - {file_template: "{pid}_CLNF_pose.txt"}
  #
  # Each source inherits every key of its modality section except the file name,
  # so a source only states what differs (a column layout, its own `validity`).
  # Quality columns and timestamps come from the FIRST source. Absent `sources`,
  # the section itself is the single source — which is why every config written
  # before this option behaves identically.
  audio:
    file_template: "{pid}_COVAREP.csv"   # 74-dim COVAREP features, ~10ms frames
    has_header: false
    delimiter: ","
    # 100 Hz x 900 s = ~90k frames; 30 x 3000 = 90k -> full session at ~3.3 Hz.
    max_frames: 3000
    frame_stride: 30
    # COVAREP has no header and no clock, so a frame's time comes from its row
    # index in the source file at this rate — 100 Hz, i.e. one row per 10 ms.
    # Used only in segment mode, to place frames inside a turn's time window.
    sample_rate_hz: 100
    # Per-frame quality signals kept aside from the model features. COVAREP has
    # no header, so these are given as {name: column_index}. Column 1 is the
    # voiced/unvoiced flag in the AVEC2017 COVAREP layout; set `quality_columns`
    # to {} to report a voiced ratio of 0, which the gate then cannot use.
    quality_columns: {voiced: 1}
    voiced_column: voiced
    # Which entries of a frame are real measurements (ADR-0030). COVAREP reports
    # a voiced/unvoiced flag, and the AVEC2017 documentation says that when
    # VUV = 0 the pitch and glottal parameters must not be used — the spectral
    # channels on the same row are still fine, so this mask is CHANNEL-wise, not
    # row-wise. Indices are into the 74-column COVAREP layout:
    #   0 F0, 2 NAQ, 3 QOQ, 4 H1H2, 5 PSP, 6 MDQ, 7 peakSlope, 8 Rd.
    # Column 1 (VUV itself) is well defined on every frame and stays valid.
    # `enabled: false` keeps the committed pipeline unchanged while the values
    # stay versioned config rather than script constants; the ADR-0030 ladder
    # flips it. The loader REFUSES to run an enabled mask under
    # `downsample: decimate`, which keeps one row per window and so has nothing
    # to average an invalid entry away with.
    validity:
      enabled: false
      voiced_column: voiced
      invalid_when_unvoiced: [0, 2, 3, 4, 5, 6, 7, 8]
    # Keep only the frames the transcript attributes to the PARTICIPANT
    # (ADR-0031). Without this the session-level acoustic branch is handed the
    # whole recording — Ellie's questions and the silence between turns included
    # — and its functionals describe the interview's structure rather than the
    # participant's voice. The segment-aligned path already did this per segment;
    # the session-level path, which every committed result used, did not.
    # Rows are placed on the clock by `sample_rate_hz` below, and the mask runs
    # BEFORE striding, so `frame_stride` counts speech frames.
    # `enabled: false` keeps the committed pipeline reproducible. The 2026-09-12
    # ladder found no significant gain, so the default remains off.
    speech_mask:
      enabled: false
      source: transcript
      pad_seconds: 0.10   # absorbs transcript alignment error at turn boundaries
    # Optional A2 filter, applied only inside participant turns in segment mode.
    # Kept disabled so historical runs remain reproducible.
    speech_filter:
      remove_unvoiced_rows: false
      min_turn_seconds: 0.0
    # Optional A1 conversational-temporal block. The compact timing/VUV vector
    # is appended to every audio segment; no Ellie text enters the model.
    ctd:
      enabled: false
    # How the `frame_stride` source rows collapse into one retained row (ADR-0030):
    #   decimate           - keep the first, discard 29. No anti-alias filter, so
    #                        prosodic variation folds into the retained band. This
    #                        is what every committed result used.
    #   mean               - average the window. Boxcar prefilter + decimate;
    #                        attenuates aliasing but is not an ideal low-pass.
    #   window_functionals - [mean, std, min, max, mean|diff|] per channel, which
    #                        recovers the full-rate mean/min/max exactly. Widens
    #                        audio 74 -> 370.
    # The 2026-09-12 ladder found no significant gain over `decimate`, so the
    # reproducibility default remains unchanged.
    downsample: decimate
    # session | corpus | none  (ADR-0019). `session` z-scores each channel WITHIN
    # the session, which forces every participant to per-channel mean 0 / std 1 and
    # so deletes absolute pitch level, formant positions and overall energy — the
    # cues a speaker-identification attacker uses, and among the best-attested
    # acoustic markers of depression. `corpus` fits mean/std on the TRAIN split
    # only and applies them everywhere, preserving between-subject differences.
    normalization: session

  video:
    file_template: "{pid}_CLNF_AUs.txt"  # OpenFace action units
    has_header: true
    delimiter: ","
    drop_columns: [frame, timestamp, confidence, success]  # OpenFace metadata cols
    # 30 Hz x 900 s = ~27k frames; 10 x 3000 = 30k -> full session at 3 Hz.
    max_frames: 3000
    frame_stride: 10
    # OpenFace records its own clock, so segment mode reads the time directly
    # rather than inferring it. `timestamp` is dropped from the model features
    # (above) and kept here alongside the tracker-quality columns the fusion
    # gate reads.
    timestamp_column: timestamp
    quality_columns: [timestamp, confidence, success]
    # OpenFace reports per-frame tracking success and confidence. On a frame the
    # tracker did not fit, no action-unit intensity is a measurement, so the mask
    # is ROW-wise. Threshold declared before measurement (ADR-0030). See the audio
    # block above for what `enabled` does. The 2026-09-12 inner-CV ladder found
    # no significant gain, so the reproducibility default remains off.
    validity:
      enabled: false
      require_success: true
      success_column: success
      confidence_column: confidence
      min_confidence: 0.90
    # Video does NOT default to the participant-speech mask. ADR-0027's reading
    # is that facial behaviour while *listening* is plausibly informative, which
    # is why segment mode gives video the whole turn envelope while audio takes
    # only the participant's own intervals. Kept here so the ladder can test that
    # reading instead of assuming it; rows are placed by `timestamp_column`.
    speech_mask:
      enabled: false
      source: transcript
      pad_seconds: 0.10
    downsample: decimate
    # session | corpus | none  (ADR-0019). `session` z-scores each channel WITHIN
    # the session, which forces every participant to per-channel mean 0 / std 1 and
    # so deletes absolute pitch level, formant positions and overall energy — the
    # cues a speaker-identification attacker uses, and among the best-attested
    # acoustic markers of depression. `corpus` fits mean/std on the TRAIN split
    # only and applies them everywhere, preserving between-subject differences.
    normalization: session

  text:
    file_template: "{pid}_TRANSCRIPT.csv"
    delimiter: "\t"                      # DAIC-WOZ transcripts are tab-separated
    speaker_column: speaker
    value_column: value
    participant_speaker: Participant     # keep only the participant's turns
    # Utterance timings. These are what let audio and video be cut at the same
    # places as the text (ADR-0027); without them segment mode has no clock.
    start_column: start_time
    stop_column: stop_time

    # hashing: pure-NumPy bag-of-words, no downloads (used by CI and mock runs).
    # transformer: contextual embeddings. Text is the strongest DAIC-WOZ
    #   modality and hashing throws away word order and context, so real runs
    #   use this — see ADR-0014.
    # How the transcript becomes a sequence for the text encoder.
    #   document: one row for the whole interview (the original behaviour). The
    #             encoder then pools over a length-1 sequence, so it cannot
    #             attend to anything and word order across the session is gone.
    #   segments: `num_segments` contiguous stretches of turns, one row each.
    #   turns:    one row per participant turn.
    representation: document
    num_segments: 8

    vectorizer: transformer
    dim: 512                             # hashing only; transformer uses its hidden size
    transformer:
      model_name: sentence-transformers/all-mpnet-base-v2
      max_length: 384                    # tokens per chunk; the session is chunked and averaged
      batch_size: 16
      device: auto
