# Real DAIC-WOZ / AVEC2017 data configuration (Phase 1).
#
# Used with: python scripts/train_baseline.py --daic-config configs/daic_woz.yaml
#
# The dataset is access-controlled (Data Use Agreement) and ~300 GB; download
# from https://dcapswoz.ict.usc.edu/ and extract each participant archive so the
# layout below holds. Model input dims are inferred from the real features at
# load time (see DaicWozDataset.feature_dims), so they are NOT set here.
#
# VERIFY the file templates and column names against your actual download before
# trusting results — see docs/architecture/ADR-0002-daic-woz-integration.md.

seed: 42

daic_woz:
  # Root containing per-participant folders (e.g. 300_P/, 301_P/, ...) and the
  # split label CSVs (paths below are resolved relative to this root).
  root: data/daic_woz
  phq8_max: 24

  participant_dir_template: "{pid}_P"

  # Parsed/subsampled feature matrices are memoized here (relative to `root`),
  # keyed by the parsing options below so a stride change invalidates them.
  # Re-parsing the ~36 MB COVAREP files on every run cost minutes; set to null
  # to disable. Lives under data/, so it is git-ignored.
  feature_cache_dir: _feature_cache

  splits:
    train: train_split_Depression_AVEC2017.csv
    dev: dev_split_Depression_AVEC2017.csv
    test: full_test_split.csv

  # Default header names (train/dev). Verified against the real corpus
  # downloaded 2026-08-13; see docs/architecture/ADR-0010.
  label_columns:
    participant_id: Participant_ID
    phq_binary: PHQ8_Binary
    phq_score: PHQ8_Score

  # The AVEC2017 test split ships different header names for the same fields
  # (PHQ_* rather than PHQ8_*). Without this override every test label would be
  # missing — the loader now raises instead of silently reading them as 0.
  split_label_columns:
    test:
      participant_id: Participant_ID
      phq_binary: PHQ_Binary
      phq_score: PHQ_Score

  # Participant 440's archive is truncated at source on the USC server (its
  # TRANSCRIPT/COVAREP/FORMANT files are absent from the published zip), so the
  # session has no text or audio modality. Dropped from the dev split; see
  # docs/architecture/ADR-0010.
  exclude_participants: [440]

  # Coverage note (ADR-0011): the loader keeps every `frame_stride`-th frame and
  # stops at `max_frames`, so stride x max_frames must exceed the raw frame count
  # or the tail of the interview is silently discarded. Interviews run ~15 min.
  # The previous 1000x5 setting covered only the first ~50 s of each session.
  audio:
    file_template: "{pid}_COVAREP.csv"   # 74-dim COVAREP features, ~10ms frames
    has_header: false
    delimiter: ","
    # 100 Hz x 900 s = ~90k frames; 30 x 3000 = 90k -> full session at ~3.3 Hz.
    max_frames: 3000
    frame_stride: 30
    # session | corpus | none  (ADR-0019). `session` z-scores each channel WITHIN
    # the session, which forces every participant to per-channel mean 0 / std 1 and
    # so deletes absolute pitch level, formant positions and overall energy — the
    # cues a speaker-identification attacker uses, and among the best-attested
    # acoustic markers of depression. `corpus` fits mean/std on the TRAIN split
    # only and applies them everywhere, preserving between-subject differences.
    normalization: session

  video:
    file_template: "{pid}_CLNF_AUs.txt"  # OpenFace action units
    has_header: true
    delimiter: ","
    drop_columns: [frame, timestamp, confidence, success]  # OpenFace metadata cols
    # 30 Hz x 900 s = ~27k frames; 10 x 3000 = 30k -> full session at 3 Hz.
    max_frames: 3000
    frame_stride: 10
    # session | corpus | none  (ADR-0019). `session` z-scores each channel WITHIN
    # the session, which forces every participant to per-channel mean 0 / std 1 and
    # so deletes absolute pitch level, formant positions and overall energy — the
    # cues a speaker-identification attacker uses, and among the best-attested
    # acoustic markers of depression. `corpus` fits mean/std on the TRAIN split
    # only and applies them everywhere, preserving between-subject differences.
    normalization: session

  text:
    file_template: "{pid}_TRANSCRIPT.csv"
    delimiter: "\t"                      # DAIC-WOZ transcripts are tab-separated
    speaker_column: speaker
    value_column: value
    participant_speaker: Participant     # keep only the participant's turns

    # hashing: pure-NumPy bag-of-words, no downloads (used by CI and mock runs).
    # transformer: contextual embeddings. Text is the strongest DAIC-WOZ
    #   modality and hashing throws away word order and context, so real runs
    #   use this — see ADR-0014.
    # How the transcript becomes a sequence for the text encoder.
    #   document: one row for the whole interview (the original behaviour). The
    #             encoder then pools over a length-1 sequence, so it cannot
    #             attend to anything and word order across the session is gone.
    #   segments: `num_segments` contiguous stretches of turns, one row each.
    #   turns:    one row per participant turn.
    representation: document
    num_segments: 8

    vectorizer: transformer
    dim: 512                             # hashing only; transformer uses its hidden size
    transformer:
      model_name: sentence-transformers/all-mpnet-base-v2
      max_length: 384                    # tokens per chunk; the session is chunked and averaged
      batch_size: 16
      device: auto
