<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="Segoe UI, Tahoma, sans-serif">
  <rect width="720" height="440" fill="#ffffff"/>

  <!-- title -->
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">Privacy–utility curve (centralized DP-SGD, 3 seeds)</text>

  <!-- plot frame -->
  <g stroke="#cccccc" stroke-width="1">
    <line x1="90" y1="70" x2="90" y2="360"/>
    <line x1="90" y1="360" x2="660" y2="360"/>
  </g>

  <!-- y gridlines and labels: AUC 0.40 -> 0.80 mapped 360 -> 70 -->
  <g stroke="#eeeeee" stroke-width="1">
    <line x1="90" y1="360" x2="660" y2="360"/>
    <line x1="90" y1="287.5" x2="660" y2="287.5"/>
    <line x1="90" y1="215" x2="660" y2="215"/>
    <line x1="90" y1="142.5" x2="660" y2="142.5"/>
    <line x1="90" y1="70" x2="660" y2="70"/>
  </g>
  <g font-size="12" fill="#555555" text-anchor="end">
    <text x="82" y="364">0.40</text>
    <text x="82" y="291.5">0.50</text>
    <text x="82" y="219">0.60</text>
    <text x="82" y="146.5">0.70</text>
    <text x="82" y="74">0.80</text>
  </g>
  <text x="32" y="215" font-size="13" fill="#333333" text-anchor="middle" transform="rotate(-90 32 215)">ROC-AUC</text>

  <!-- x positions: eps 0.5,1,2,4,8,16 at 140,230,320,410,500,590 ; inf at 640 -->
  <g font-size="12" fill="#555555" text-anchor="middle">
    <text x="140" y="380">0.5</text>
    <text x="230" y="380">1</text>
    <text x="320" y="380">2</text>
    <text x="410" y="380">4</text>
    <text x="500" y="380">8</text>
    <text x="590" y="380">16</text>
    <text x="645" y="380">∞</text>
  </g>
  <text x="375" y="404" font-size="13" fill="#333333" text-anchor="middle">privacy budget ε (log scale)</text>

  <!-- chance line at 0.50 -->
  <line x1="90" y1="287.5" x2="660" y2="287.5" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="655" y="283" font-size="11" fill="#777777" text-anchor="end">chance = 0.50</text>

  <!-- non-private reference 0.740 -> y = 360 - (0.740-0.40)*725 = 360-246.5 = 113.5 -->
  <line x1="90" y1="113.5" x2="660" y2="113.5" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="655" y="109" font-size="11" fill="#2e7d32" text-anchor="end">no DP, no clipping = 0.740</text>

  <!-- error bars (±sd) -->
  <g stroke="#1565c0" stroke-width="1.4">
    <!-- 0.5: .480 ±.095 -> y=302 ; sd*725=68.9 -->
    <line x1="140" y1="233.1" x2="140" y2="370.9"/><line x1="134" y1="233.1" x2="146" y2="233.1"/><line x1="134" y1="370.9" x2="146" y2="370.9"/>
    <!-- 1: .477 ±.087 -> y=304.2 ; 63.1 -->
    <line x1="230" y1="241.1" x2="230" y2="367.3"/><line x1="224" y1="241.1" x2="236" y2="241.1"/><line x1="224" y1="367.3" x2="236" y2="367.3"/>
    <!-- 2: .513 ±.081 -> y=278.0 ; 58.7 -->
    <line x1="320" y1="219.3" x2="320" y2="336.7"/><line x1="314" y1="219.3" x2="326" y2="219.3"/><line x1="314" y1="336.7" x2="326" y2="336.7"/>
    <!-- 4: .510 ±.104 -> y=280.2 ; 75.4 -->
    <line x1="410" y1="204.8" x2="410" y2="355.6"/><line x1="404" y1="204.8" x2="416" y2="204.8"/><line x1="404" y1="355.6" x2="416" y2="355.6"/>
    <!-- 8: .578 ±.065 -> y=231.0 ; 47.1 -->
    <line x1="500" y1="183.9" x2="500" y2="278.1"/><line x1="494" y1="183.9" x2="506" y2="183.9"/><line x1="494" y1="278.1" x2="506" y2="278.1"/>
    <!-- 16: .582 ±.042 -> y=228.1 ; 30.5 -->
    <line x1="590" y1="197.6" x2="590" y2="258.6"/><line x1="584" y1="197.6" x2="596" y2="197.6"/><line x1="584" y1="258.6" x2="596" y2="258.6"/>
    <!-- inf: .589 ±.006 -> y=223.0 ; 4.4 -->
    <line x1="645" y1="218.6" x2="645" y2="227.4"/><line x1="639" y1="218.6" x2="651" y2="218.6"/><line x1="639" y1="227.4" x2="651" y2="227.4"/>
  </g>

  <!-- curve -->
  <polyline points="140,302 230,304.2 320,278 410,280.2 500,231 590,228.1" fill="none" stroke="#1565c0" stroke-width="2.4"/>
  <!-- dashed link to clipping-only point -->
  <line x1="590" y1="228.1" x2="645" y2="223" stroke="#1565c0" stroke-width="2.4" stroke-dasharray="5 4"/>

  <!-- markers -->
  <g fill="#1565c0">
    <circle cx="140" cy="302" r="4.5"/>
    <circle cx="230" cy="304.2" r="4.5"/>
    <circle cx="320" cy="278" r="4.5"/>
    <circle cx="410" cy="280.2" r="4.5"/>
    <circle cx="500" cy="231" r="4.5"/>
    <circle cx="590" cy="228.1" r="4.5"/>
  </g>
  <circle cx="645" cy="223" r="5.5" fill="#ffffff" stroke="#1565c0" stroke-width="2.4"/>

  <!-- annotation: clipping cost -->
  <g stroke="#c62828" stroke-width="1.6">
    <line x1="676" y1="113.5" x2="676" y2="223"/>
    <line x1="671" y1="113.5" x2="681" y2="113.5"/>
    <line x1="671" y1="223" x2="681" y2="223"/>
  </g>
  <text x="690" y="172" font-size="11" fill="#c62828" text-anchor="middle" transform="rotate(-90 690 172)">clipping alone: −0.151</text>

  <!-- footnote -->
  <text x="90" y="428" font-size="11" fill="#666666">Source: experiments/phase3/phase3_dp_budget_sweep_20260904_103633 — error bars are ±1 sd over 3 seeds.</text>
</svg>
