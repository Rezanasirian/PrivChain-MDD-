<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" font-family="Vazirmatn, Tahoma, 'Segoe UI', sans-serif">
  <rect width="760" height="520" fill="#ffffff"/>
  <text x="380" y="26" text-anchor="middle" direction="rtl" font-size="16" font-weight="600" fill="#1a1a1a">یک دور فدرال: تجمیع آگاه از قابلیت با حسابرسی روی زنجیره</text>

  <!-- خطوط عمر: راست به چپ -->
  <g font-size="12" font-weight="600">
    <rect x="590" y="46" width="130" height="30" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="655" y="66" text-anchor="middle" direction="rtl" fill="#1b5e20">کلاینت‌ها</text>

    <rect x="370" y="46" width="150" height="30" rx="4" fill="#e3f2fd" stroke="#1565c0"/>
    <text x="445" y="66" text-anchor="middle" direction="rtl" fill="#0d47a1">هماهنگ‌کننده</text>

    <rect x="170" y="46" width="130" height="30" rx="4" fill="#f3e5f5" stroke="#8e24aa"/>
    <text x="235" y="66" text-anchor="middle" direction="rtl" fill="#6a1b9a">قرارداد هوشمند</text>

    <rect x="40" y="46" width="90" height="30" rx="4" fill="#eceff1" stroke="#546e7a"/>
    <text x="85" y="66" text-anchor="middle" direction="rtl" fill="#37474f">دفتر کل</text>
  </g>
  <g stroke="#cfd8dc" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="655" y1="76" x2="655" y2="470"/>
    <line x1="445" y1="76" x2="445" y2="470"/>
    <line x1="235" y1="76" x2="235" y2="470"/>
    <line x1="85" y1="76" x2="85" y2="470"/>
  </g>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#455a64"/></marker>
  </defs>

  <!-- ۰ ثبت‌نام -->
  <g stroke="#8e24aa" stroke-width="1.6" marker-end="url(#a1)">
    <line x1="655" y1="100" x2="240" y2="100"/>
  </g>
  <text x="450" y="94" font-size="11" fill="#6a1b9a" text-anchor="middle" direction="rtl">۰. ثبت کلاینت با بردار قابلیت — یک بار، پیش از آموزش</text>

  <!-- ۱ ساخت زیرگراف -->
  <rect x="378" y="116" width="134" height="34" rx="4" fill="#ffffff" stroke="#1565c0"/>
  <text x="445" y="137" font-size="11" fill="#0d47a1" text-anchor="middle" direction="rtl">۱. ساخت زیرگراف هر وجه</text>

  <!-- ۲ پخش -->
  <g stroke="#455a64" stroke-width="1.6" marker-end="url(#a1)">
    <line x1="450" y1="168" x2="650" y2="168"/>
  </g>
  <text x="550" y="162" font-size="11" fill="#37474f" text-anchor="middle" direction="rtl">۲. ارسال مدل سراسری برای گروه‌هایی که هر کلاینت دارد</text>

  <!-- ۳ آموزش محلی -->
  <rect x="500" y="184" width="222" height="86" rx="5" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="611" y="202" font-size="11.5" font-weight="600" fill="#1b5e20" text-anchor="middle" direction="rtl">۳. آموزش محلی</text>
  <text x="611" y="220" font-size="10" fill="#2e7d32" text-anchor="middle" direction="rtl">زیان نظارتی + تقطیر، رابطهٔ (۳-۱۷)</text>
  <text x="611" y="236" font-size="10" fill="#2e7d32" text-anchor="middle" direction="rtl">برش به تفکیک گروه، رابطهٔ (۳-۶)</text>
  <text x="611" y="252" font-size="10" fill="#c62828" text-anchor="middle" direction="rtl">نویز گوسی به تفکیک گروه، رابطهٔ (۳-۷)</text>
  <text x="611" y="266" font-size="9.5" fill="#558b2f" text-anchor="middle" direction="rtl">جلسه‌های خام هرگز از کلاینت خارج نمی‌شوند</text>

  <!-- ۴ ارسال -->
  <g stroke="#2e7d32" stroke-width="1.8" marker-end="url(#a1)">
    <line x1="650" y1="288" x2="450" y2="288"/>
  </g>
  <text x="550" y="282" font-size="11" fill="#1b5e20" text-anchor="middle" direction="rtl">۴. ارسال به‌روزرسانی — فقط برای گروه‌هایی که کلاینت واقعاً دارد</text>

  <!-- ۵ تجمیع -->
  <rect x="342" y="304" width="208" height="72" rx="5" fill="#e3f2fd" stroke="#42a5f5"/>
  <text x="446" y="322" font-size="11.5" font-weight="600" fill="#0d47a1" text-anchor="middle" direction="rtl">۵. تجمیع</text>
  <text x="446" y="339" font-size="10.5" fill="#1565c0" text-anchor="middle" direction="rtl">به‌روزرسانی شهرت، رابطهٔ (۳-۱۵)</text>
  <text x="446" y="355" font-size="10.5" fill="#1565c0" text-anchor="middle" direction="rtl">میانگین زیرگرافی، رابطهٔ (۳-۱۲)</text>
  <text x="446" y="370" font-size="10" fill="#c62828" text-anchor="middle" direction="rtl">زیرگراف خالی ← رمزگذار دست‌نخورده (۳-۱۳)</text>

  <!-- ۶ ثبت روی زنجیره -->
  <g stroke="#8e24aa" stroke-width="1.6" marker-end="url(#a1)">
    <line x1="440" y1="394" x2="240" y2="394"/>
  </g>
  <text x="340" y="388" font-size="11" fill="#6a1b9a" text-anchor="middle" direction="rtl">۶. ثبت بودجه، شهرت و زیرگراف این دور</text>

  <!-- ۷ تثبیت -->
  <g stroke="#546e7a" stroke-width="1.6" marker-end="url(#a1)">
    <line x1="230" y1="420" x2="90" y2="420"/>
  </g>
  <text x="160" y="414" font-size="11" fill="#37474f" text-anchor="middle" direction="rtl">۷. تثبیت (اجماع از خانوادهٔ PBFT)</text>

  <!-- ۸ دور بعد -->
  <g stroke="#455a64" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a1)">
    <path d="M450,446 L640,446" fill="none"/>
  </g>
  <text x="545" y="437" font-size="11" fill="#37474f" text-anchor="middle" direction="rtl">۸. دور بعد، تا توقف زودهنگام روی بخش انتخاب</text>

  <!-- کادر توضیح -->
  <rect x="40" y="150" width="288" height="200" rx="6" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="314" y="172" font-size="12" font-weight="600" fill="#333333" direction="rtl" text-anchor="start">هر کلاینت چه چیزی می‌فرستد</text>
  <g font-size="11" fill="#444444" direction="rtl" text-anchor="start">
    <text x="314" y="194">[۱,۱,۱] ← صوت، ویدئو، متن، مشترک</text>
    <text x="314" y="214">[۱,۰,۱] ← صوت، متن، مشترک</text>
    <text x="314" y="234">[۱,۰,۰] ← صوت، مشترک</text>
    <text x="314" y="254">[۰,۰,۱] ← متن، مشترک</text>
  </g>
  <line x1="56" y1="268" x2="334" y2="268" stroke="#e0e0e0"/>
  <text x="314" y="288" font-size="11" fill="#c62828" direction="rtl" text-anchor="start">کلاینت برای گروهی که ندارد، σ گزارش نمی‌کند:</text>
  <text x="314" y="306" font-size="11" fill="#c62828" direction="rtl" text-anchor="start">کلاینت فقط‌متن هرگز سازوکار صوتی ادعا نمی‌کند.</text>
  <text x="314" y="328" font-size="11" fill="#666666" direction="rtl" text-anchor="start">همین است که ردیف‌های بودجه در دفتر کل را</text>
  <text x="314" y="344" font-size="11" fill="#666666" direction="rtl" text-anchor="start">قابل حسابرسی می‌کند، نه صرفاً موجود.</text>

  <text x="720" y="496" font-size="11" fill="#666666" direction="rtl" text-anchor="start">دفتر کل تضمین می‌کند ردپای حسابرسی تغییرناپذیر است. تضمین نمی‌کند هر به‌روزرسانی رفتار درستی داشته —</text>
  <text x="720" y="510" font-size="11" fill="#666666" direction="rtl" text-anchor="start">آن را وزن‌دهی شهرت تضعیف می‌کند، به‌عنوان یک پیشین سبک و نه کران اثبات‌شدهٔ بیزانسی.</text>
</svg>
