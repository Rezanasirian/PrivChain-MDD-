<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="Segoe UI, Tahoma, sans-serif">
  <rect width="760" height="470" fill="#ffffff"/>
  <text x="380" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">Where the two research gaps sit in the reviewed literature</text>

  <!-- columns header -->
  <g font-size="12" font-weight="600" fill="#37474f">
    <text x="150" y="62" text-anchor="middle">Multimodal depression detection</text>
    <text x="390" y="62" text-anchor="middle">Privacy-preserving federated learning</text>
    <text x="630" y="62" text-anchor="middle">Blockchain-anchored FL</text>
  </g>

  <!-- column bodies -->
  <rect x="40" y="74" width="220" height="180" rx="6" fill="#fff8e1" stroke="#f9a825"/>
  <g font-size="11" fill="#5d4037">
    <text x="56" y="96" font-weight="600" fill="#f57f17">what it solves</text>
    <text x="56" y="116">fusion architectures, attention,</text>
    <text x="56" y="132">causal and knowledge-graph models</text>
    <text x="56" y="156" font-weight="600" fill="#c62828">what it assumes</text>
    <text x="56" y="176">every training sample has all three</text>
    <text x="56" y="192">modalities, simultaneously</text>
    <text x="56" y="216" font-weight="600" fill="#c62828">what it never asks</text>
    <text x="56" y="236">how the data was allowed to be pooled</text>
  </g>

  <rect x="280" y="74" width="220" height="180" rx="6" fill="#e3f2fd" stroke="#42a5f5"/>
  <g font-size="11" fill="#37474f">
    <text x="296" y="96" font-weight="600" fill="#0d47a1">what it solves</text>
    <text x="296" y="116">training without pooling raw data,</text>
    <text x="296" y="132">DP-SGD, non-IID aggregation</text>
    <text x="296" y="156" font-weight="600" fill="#c62828">what it assumes</text>
    <text x="296" y="176">one uniform ε over the whole</text>
    <text x="296" y="192">gradient vector</text>
    <text x="296" y="216" font-weight="600" fill="#c62828">what it never asks</text>
    <text x="296" y="236">which modality each parameter serves</text>
  </g>

  <rect x="520" y="74" width="200" height="180" rx="6" fill="#f3e5f5" stroke="#ab47bc"/>
  <g font-size="11" fill="#4a148c">
    <text x="536" y="96" font-weight="600" fill="#6a1b9a">what it solves</text>
    <text x="536" y="116">immutable audit of updates,</text>
    <text x="536" y="132">consent, Byzantine tolerance</text>
    <text x="536" y="156" font-weight="600" fill="#c62828">what it assumes</text>
    <text x="536" y="176">clients are functionally homogeneous</text>
    <text x="536" y="216" font-weight="600" fill="#c62828">what it never asks</text>
    <text x="536" y="236">how to declare partial capability</text>
  </g>

  <!-- gap 1 -->
  <path d="M270,164 L286,164" stroke="#9e9e9e" stroke-width="2"/>
  <rect x="150" y="286" width="330" height="72" rx="6" fill="#ffebee" stroke="#e53935" stroke-width="2"/>
  <text x="315" y="308" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b71c1c">Gap 1 — per-modality privacy calibration</text>
  <text x="315" y="328" text-anchor="middle" font-size="11" fill="#444">Three modalities carry very different re-identification risk,</text>
  <text x="315" y="344" text-anchor="middle" font-size="11" fill="#444">yet every framework spends one budget across all of them.</text>

  <!-- gap 2 -->
  <rect x="400" y="376" width="320" height="72" rx="6" fill="#ffebee" stroke="#e53935" stroke-width="2"/>
  <text x="560" y="398" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b71c1c">Gap 2 — asymmetric access to modalities</text>
  <text x="560" y="418" text-anchor="middle" font-size="11" fill="#444">Real institutions hold different subsets of the modalities;</text>
  <text x="560" y="434" text-anchor="middle" font-size="11" fill="#444">standard aggregation is structurally blind to that.</text>

  <!-- connectors -->
  <g stroke="#e53935" stroke-width="1.8" stroke-dasharray="5 4" fill="none">
    <path d="M150,254 L200,286"/>
    <path d="M390,254 L360,286"/>
    <path d="M390,254 L470,376"/>
    <path d="M630,254 L640,376"/>
    <path d="M150,254 L430,376"/>
  </g>

  <!-- contribution marker -->
  <rect x="40" y="376" width="330" height="72" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="205" y="398" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1b5e20">This thesis fills both gaps in one framework</text>
  <text x="205" y="418" text-anchor="middle" font-size="11" fill="#444">risk-calibrated per-group noise with on-chain audit,</text>
  <text x="205" y="434" text-anchor="middle" font-size="11" fill="#444">plus capability-declared subgraph aggregation.</text>

  <text x="40" y="466" font-size="11" fill="#666666">Each gap is a missing artifact, not a missing observation — which is why the method of Chapter 3 is design-based research.</text>
</svg>
