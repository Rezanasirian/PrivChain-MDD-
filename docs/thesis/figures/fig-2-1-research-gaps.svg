<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="Vazirmatn, Tahoma, 'Segoe UI', sans-serif">
  <rect width="760" height="470" fill="#ffffff"/>
  <text x="380" y="26" text-anchor="middle" direction="rtl" font-size="16" font-weight="600" fill="#1a1a1a">جایگاه دو شکاف پژوهشی در تلاقی ادبیات مرورشده</text>

  <g font-size="12" font-weight="600" fill="#37474f">
    <text x="610" y="62" text-anchor="middle" direction="rtl">تشخیص افسردگی چندوجهی</text>
    <text x="390" y="62" text-anchor="middle" direction="rtl">یادگیری فدرال با حفظ حریم خصوصی</text>
    <text x="150" y="62" text-anchor="middle" direction="rtl">یادگیری فدرال مبتنی بر بلاک‌چین</text>
  </g>

  <rect x="500" y="74" width="220" height="180" rx="6" fill="#fff8e1" stroke="#f9a825"/>
  <g font-size="11" fill="#5d4037">
    <text x="704" y="96" direction="rtl" text-anchor="start" font-weight="600" fill="#f57f17">چه چیزی را حل می‌کند</text>
    <text x="704" y="116" direction="rtl" text-anchor="start">معماری‌های همجوشی، توجه،</text>
    <text x="704" y="132" direction="rtl" text-anchor="start">مدل‌های علّی و گراف دانش</text>
    <text x="704" y="156" direction="rtl" text-anchor="start" font-weight="600" fill="#c62828">چه چیزی را فرض می‌کند</text>
    <text x="704" y="176" direction="rtl" text-anchor="start">هر نمونهٔ آموزشی هر سه وجه را</text>
    <text x="704" y="192" direction="rtl" text-anchor="start">هم‌زمان دارد</text>
    <text x="704" y="216" direction="rtl" text-anchor="start" font-weight="600" fill="#c62828">چه چیزی را هرگز نمی‌پرسد</text>
    <text x="704" y="236" direction="rtl" text-anchor="start">داده چگونه اجازهٔ تجمیع یافت</text>
  </g>

  <rect x="280" y="74" width="220" height="180" rx="6" fill="#e3f2fd" stroke="#42a5f5"/>
  <g font-size="11" fill="#37474f">
    <text x="484" y="96" direction="rtl" text-anchor="start" font-weight="600" fill="#0d47a1">چه چیزی را حل می‌کند</text>
    <text x="484" y="116" direction="rtl" text-anchor="start">آموزش بدون تجمیع دادهٔ خام،</text>
    <text x="484" y="132" direction="rtl" text-anchor="start">DP-SGD، تجمیع دادهٔ ناهمسان</text>
    <text x="484" y="156" direction="rtl" text-anchor="start" font-weight="600" fill="#c62828">چه چیزی را فرض می‌کند</text>
    <text x="484" y="176" direction="rtl" text-anchor="start">یک ε یکنواخت روی کل</text>
    <text x="484" y="192" direction="rtl" text-anchor="start">بردار گرادیان</text>
    <text x="484" y="216" direction="rtl" text-anchor="start" font-weight="600" fill="#c62828">چه چیزی را هرگز نمی‌پرسد</text>
    <text x="484" y="236" direction="rtl" text-anchor="start">هر پارامتر به کدام وجه تعلق دارد</text>
  </g>

  <rect x="40" y="74" width="220" height="180" rx="6" fill="#f3e5f5" stroke="#ab47bc"/>
  <g font-size="11" fill="#4a148c">
    <text x="244" y="96" direction="rtl" text-anchor="start" font-weight="600" fill="#6a1b9a">چه چیزی را حل می‌کند</text>
    <text x="244" y="116" direction="rtl" text-anchor="start">حسابرسی تغییرناپذیر به‌روزرسانی‌ها،</text>
    <text x="244" y="132" direction="rtl" text-anchor="start">رضایت، تحمل خطای بیزانس</text>
    <text x="244" y="156" direction="rtl" text-anchor="start" font-weight="600" fill="#c62828">چه چیزی را فرض می‌کند</text>
    <text x="244" y="176" direction="rtl" text-anchor="start">کلاینت‌ها از نظر عملکرد همگون‌اند</text>
    <text x="244" y="216" direction="rtl" text-anchor="start" font-weight="600" fill="#c62828">چه چیزی را هرگز نمی‌پرسد</text>
    <text x="244" y="236" direction="rtl" text-anchor="start">قابلیت ناقص چگونه اعلام شود</text>
  </g>

  <!-- اتصال‌ها زیر جعبه‌ها رسم می‌شوند -->
  <g stroke="#e53935" stroke-width="1.8" stroke-dasharray="5 4" fill="none">
    <path d="M610,254 L520,286"/>
    <path d="M390,254 L400,286"/>
    <path d="M390,254 L250,376"/>
    <path d="M150,254 L130,376"/>
  </g>

  <!-- شکاف ۱ -->
  <rect x="280" y="286" width="330" height="72" rx="6" fill="#ffebee" stroke="#e53935" stroke-width="2"/>
  <text x="445" y="308" text-anchor="middle" direction="rtl" font-size="12.5" font-weight="600" fill="#b71c1c">شکاف ۱ — کالیبراسیون حریم خصوصی به ازای هر وجه</text>
  <text x="445" y="328" text-anchor="middle" direction="rtl" font-size="11" fill="#444">سه وجه داده خطر بازشناسایی بسیار متفاوتی دارند،</text>
  <text x="445" y="344" text-anchor="middle" direction="rtl" font-size="11" fill="#444">اما هر چارچوب یک بودجهٔ واحد روی همهٔ آن‌ها خرج می‌کند.</text>

  <!-- شکاف ۲ -->
  <rect x="40" y="376" width="320" height="72" rx="6" fill="#ffebee" stroke="#e53935" stroke-width="2"/>
  <text x="200" y="398" text-anchor="middle" direction="rtl" font-size="12.5" font-weight="600" fill="#b71c1c">شکاف ۲ — دسترسی نامتقارن به وجوه داده</text>
  <text x="200" y="418" text-anchor="middle" direction="rtl" font-size="11" fill="#444">مؤسسات واقعی زیرمجموعه‌های متفاوتی از وجوه را دارند؛</text>
  <text x="200" y="434" text-anchor="middle" direction="rtl" font-size="11" fill="#444">تجمیع استاندارد از نظر ساختاری به این تفاوت نابیناست.</text>


  <rect x="390" y="376" width="330" height="72" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="555" y="398" text-anchor="middle" direction="rtl" font-size="12.5" font-weight="600" fill="#1b5e20">این رساله هر دو شکاف را در یک چارچوب پر می‌کند</text>
  <text x="555" y="418" text-anchor="middle" direction="rtl" font-size="11" fill="#444">نویز به تفکیک گروه، کالیبره‌شده با خطر، با حسابرسی روی زنجیره،</text>
  <text x="555" y="434" text-anchor="middle" direction="rtl" font-size="11" fill="#444">به‌همراه تجمیع زیرگرافی با قابلیت اعلام‌شده.</text>

  <text x="720" y="466" font-size="11" fill="#666666" direction="rtl" text-anchor="start">هر شکاف یک مصنوعِ غایب است، نه یک مشاهدهٔ غایب — و به همین دلیل روش فصل ۳ پژوهش طراحی‌محور است.</text>
</svg>
