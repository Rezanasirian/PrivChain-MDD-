<svg xmlns="http://www.w3.org/2000/svg" width="760" height="528" viewBox="0 0 760 528" font-family="Vazirmatn, Tahoma, 'Segoe UI', sans-serif">
  <rect width="760" height="520" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a" direction="rtl">معماری سه‌لایهٔ چارچوب PrivChain-MDD</text>

  <!-- لایهٔ ۳: حسابرسی -->
  <rect x="40" y="50" width="680" height="96" rx="8" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5"/>
  <text x="704" y="72" font-size="13" font-weight="600" fill="#6a1b9a" direction="rtl" text-anchor="start">لایهٔ حسابرسی — Hyperledger Fabric (شبکهٔ مجاز)</text>
  <g font-size="11.5" fill="#4a148c">
    <rect x="558" y="84" width="142" height="46" rx="5" fill="#ffffff" stroke="#ce93d8"/>
    <text x="629" y="103" text-anchor="middle" font-weight="600">RegisterClient</text>
    <text x="629" y="120" text-anchor="middle" font-size="10.5" fill="#7b1fa2" direction="rtl">بردار قابلیت وجهی</text>

    <rect x="392" y="84" width="150" height="46" rx="5" fill="#ffffff" stroke="#ce93d8"/>
    <text x="467" y="103" text-anchor="middle" font-weight="600">LogPrivacyBudget</text>
    <text x="467" y="120" text-anchor="middle" font-size="10.5" fill="#7b1fa2" direction="rtl">ε هر گروه، در هر دور</text>

    <rect x="226" y="84" width="150" height="46" rx="5" fill="#ffffff" stroke="#ce93d8"/>
    <text x="301" y="103" text-anchor="middle" font-weight="600">UpdateReputation</text>
    <text x="301" y="120" text-anchor="middle" font-size="10.5" fill="#7b1fa2" direction="rtl">شهرت هر کلاینت</text>

    <rect x="60" y="84" width="150" height="46" rx="5" fill="#ffffff" stroke="#ce93d8"/>
    <text x="135" y="103" text-anchor="middle" font-weight="600">PublishSubgraph</text>
    <text x="135" y="120" text-anchor="middle" font-size="10.5" fill="#7b1fa2" direction="rtl">اعضای زیرگراف هر وجه</text>
  </g>

  <!-- پیکان فدراسیون ← حسابرسی -->
  <line x1="380" y1="182" x2="380" y2="152" stroke="#8e24aa" stroke-width="1.8" marker-end="url(#arrowPurple)"/>
  <text x="392" y="170" font-size="10.5" fill="#6a1b9a" direction="rtl" text-anchor="end">ردپای حسابرسی تغییرناپذیر در هر دور</text>

  <!-- لایهٔ ۲: فدراسیون -->
  <rect x="40" y="184" width="680" height="118" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="704" y="206" font-size="13" font-weight="600" fill="#0d47a1" direction="rtl" text-anchor="start">لایهٔ فدراسیون — تجمیع آگاه از قابلیت وجهی (Flower)</text>

  <rect x="500" y="218" width="190" height="66" rx="5" fill="#ffffff" stroke="#90caf9"/>
  <text x="595" y="238" text-anchor="middle" font-size="12" font-weight="600" fill="#0d47a1" direction="rtl">تجمیع زیرگرافی</text>
  <text x="595" y="256" text-anchor="middle" font-size="10.5" fill="#1565c0" direction="rtl">میانگین هر رمزگذار فقط روی دارندگان آن وجه</text>
  <text x="595" y="273" text-anchor="middle" font-size="10.5" fill="#c62828" direction="rtl">زیرگراف خالی ← رمزگذار دست‌نخورده</text>

  <rect x="285" y="218" width="190" height="66" rx="5" fill="#ffffff" stroke="#90caf9"/>
  <text x="380" y="238" text-anchor="middle" font-size="12" font-weight="600" fill="#0d47a1" direction="rtl">وزن‌دهی مبتنی بر شهرت</text>
  <text x="380" y="256" text-anchor="middle" font-size="10.5" fill="#1565c0" direction="rtl">حجم داده + سازگاری با اجماع</text>
  <text x="380" y="273" text-anchor="middle" font-size="10.5" fill="#1565c0" direction="rtl">هموارشده با EMA در طول دورها</text>

  <rect x="70" y="218" width="190" height="66" rx="5" fill="#ffffff" stroke="#90caf9"/>
  <text x="165" y="238" text-anchor="middle" font-size="12" font-weight="600" fill="#0d47a1" direction="rtl">تقطیر بین‌وجهی</text>
  <text x="165" y="256" text-anchor="middle" font-size="10.5" fill="#1565c0" direction="rtl">لنگرهای مصنوعی بدون داده</text>
  <text x="165" y="273" text-anchor="middle" font-size="10.5" fill="#1565c0" direction="rtl">معلم با ماسک کامل، دانش‌آموز با ماسک خود</text>

  <!-- پیکان کلاینت ← فدراسیون -->
  <line x1="380" y1="338" x2="380" y2="308" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <text x="366" y="318" font-size="10.5" fill="#2e7d32" direction="rtl" text-anchor="start">به‌روزرسانی‌های برش‌خورده و نویزی‌شده به تفکیک گروه</text>
  <text x="366" y="333" font-size="10.5" fill="#2e7d32" direction="rtl" text-anchor="start">دادهٔ خام هرگز از کلاینت خارج نمی‌شود</text>

  <!-- لایهٔ ۱: کلاینت‌ها -->
  <rect x="40" y="340" width="680" height="150" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="704" y="362" font-size="13" font-weight="600" fill="#1b5e20" direction="rtl" text-anchor="start">لایهٔ کلاینت — آموزش محلی با DP-SGD به تفکیک گروه (PyTorch + Opacus)</text>

  <g font-size="11">
    <rect x="550" y="374" width="150" height="100" rx="5" fill="#ffffff" stroke="#a5d6a7"/>
    <text x="625" y="393" text-anchor="middle" font-size="12" font-weight="600" fill="#1b5e20" direction="rtl">کلینیک پژوهشی</text>
    <text x="625" y="411" text-anchor="middle" fill="#2e7d32">c = [۱, ۱, ۱]</text>
    <text x="625" y="432" text-anchor="middle" font-size="10.5" fill="#555" direction="rtl">صوت · ویدئو · متن</text>
    <text x="625" y="456" text-anchor="middle" font-size="10.5" fill="#c62828" direction="rtl">۴ گروه پارامتر</text>

    <rect x="385" y="374" width="150" height="100" rx="5" fill="#ffffff" stroke="#a5d6a7"/>
    <text x="460" y="393" text-anchor="middle" font-size="12" font-weight="600" fill="#1b5e20" direction="rtl">اپلیکیشن تله‌روان‌پزشکی</text>
    <text x="460" y="411" text-anchor="middle" fill="#2e7d32">c = [۱, ۰, ۱]</text>
    <text x="460" y="432" text-anchor="middle" font-size="10.5" fill="#555" direction="rtl">صوت · متن</text>
    <text x="460" y="456" text-anchor="middle" font-size="10.5" fill="#c62828" direction="rtl">۳ گروه پارامتر</text>

    <rect x="220" y="374" width="150" height="100" rx="5" fill="#ffffff" stroke="#a5d6a7"/>
    <text x="295" y="393" text-anchor="middle" font-size="12" font-weight="600" fill="#1b5e20" direction="rtl">بخش بستری</text>
    <text x="295" y="411" text-anchor="middle" fill="#2e7d32">c = [۱, ۰, ۰]</text>
    <text x="295" y="432" text-anchor="middle" font-size="10.5" fill="#555" direction="rtl">فقط صوت</text>
    <text x="295" y="456" text-anchor="middle" font-size="10.5" fill="#c62828" direction="rtl">۲ گروه پارامتر</text>

    <rect x="60" y="374" width="145" height="100" rx="5" fill="#ffffff" stroke="#a5d6a7"/>
    <text x="132" y="393" text-anchor="middle" font-size="12" font-weight="600" fill="#1b5e20" direction="rtl">مددکار سلامت روان</text>
    <text x="132" y="411" text-anchor="middle" fill="#2e7d32">c = [۰, ۰, ۱]</text>
    <text x="132" y="432" text-anchor="middle" font-size="10.5" fill="#555" direction="rtl">فقط متن</text>
    <text x="132" y="456" text-anchor="middle" font-size="10.5" fill="#c62828" direction="rtl">۲ گروه پارامتر</text>
  </g>

  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#2e7d32"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#8e24aa"/>
    </marker>
  </defs>

  <text x="720" y="506" font-size="10.5" fill="#666666" direction="rtl" text-anchor="start">دو نوآوری در دو لایهٔ متفاوت قرار دارند: تخصیص نویز به تفکیک گروه در لایهٔ کلاینت، و تجمیع آگاه از قابلیت در لایهٔ فدراسیون.</text>
  <text x="720" y="518" font-size="10.5" fill="#666666" direction="rtl" text-anchor="start">لایهٔ حسابرسی هر دو را پس از اجرا راستی‌آزمایی‌پذیر می‌کند؛ درستی هیچ‌کدام را تضمین نمی‌کند.</text>
</svg>
