<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" font-family="Segoe UI, Tahoma, sans-serif">
  <rect width="760" height="440" fill="#ffffff"/>

  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">ROC-AUC by client modality-access pattern (official dev split, 3 seeds)</text>

  <!-- y axis: 0.40 (y=340) to 0.80 (y=70) => 675 px per 1.0 -->
  <g stroke="#cccccc" stroke-width="1">
    <line x1="80" y1="70" x2="80" y2="340"/>
    <line x1="80" y1="340" x2="710" y2="340"/>
  </g>
  <g stroke="#eeeeee" stroke-width="1">
    <line x1="80" y1="272.5" x2="710" y2="272.5"/>
    <line x1="80" y1="205" x2="710" y2="205"/>
    <line x1="80" y1="137.5" x2="710" y2="137.5"/>
    <line x1="80" y1="70" x2="710" y2="70"/>
  </g>
  <g font-size="12" fill="#555555" text-anchor="end">
    <text x="72" y="344">0.40</text>
    <text x="72" y="276.5">0.50</text>
    <text x="72" y="209">0.60</text>
    <text x="72" y="141.5">0.70</text>
    <text x="72" y="74">0.80</text>
  </g>
  <text x="28" y="205" font-size="13" fill="#333333" text-anchor="middle" transform="rotate(-90 28 205)">ROC-AUC</text>

  <!-- chance -->
  <line x1="80" y1="272.5" x2="710" y2="272.5" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="706" y="268" font-size="11" fill="#777777" text-anchor="end">chance</text>

  <!-- group centres: full=180, audio+text=330, audio-only=480, text-only=630 ; bar width 26, 5 bars -->
  <!-- helper: y = 340 - (auc-0.40)*675 -->

  <!-- GROUP 1: full  centralized .740 / fedavg .476 / capability .495 / cap+rep .494 / framework .551 -->
  <rect x="115" y="110.5" width="26" height="229.5" fill="#2e7d32"/>
  <rect x="143" y="288.7" width="26" height="51.3" fill="#e0e0e0"/>
  <rect x="171" y="275.9" width="26" height="64.1" fill="#bdbdbd"/>
  <rect x="199" y="276.6" width="26" height="63.4" fill="#90caf9"/>
  <rect x="227" y="238.1" width="26" height="101.9" fill="#1565c0"/>
  <text x="184" y="360" font-size="12.5" fill="#333333" text-anchor="middle">full</text>

  <!-- GROUP 2: audio+text  .715 / .516 / .514 / .511 / .551 -->
  <rect x="265" y="127.4" width="26" height="212.6" fill="#2e7d32"/>
  <rect x="293" y="261.7" width="26" height="78.3" fill="#e0e0e0"/>
  <rect x="321" y="263.1" width="26" height="76.9" fill="#bdbdbd"/>
  <rect x="349" y="265.1" width="26" height="74.9" fill="#90caf9"/>
  <rect x="377" y="238.1" width="26" height="101.9" fill="#1565c0"/>
  <text x="334" y="360" font-size="12.5" fill="#333333" text-anchor="middle">audio + text</text>

  <!-- GROUP 3: audio-only  .534 / .497 / .490 / .491 / .542 -->
  <rect x="415" y="249.6" width="26" height="90.4" fill="#2e7d32"/>
  <rect x="443" y="274.5" width="26" height="65.5" fill="#e0e0e0"/>
  <rect x="471" y="279.3" width="26" height="60.7" fill="#bdbdbd"/>
  <rect x="499" y="278.6" width="26" height="61.4" fill="#90caf9"/>
  <rect x="527" y="244.2" width="26" height="95.8" fill="#1565c0"/>
  <text x="484" y="360" font-size="12.5" font-weight="600" fill="#333333" text-anchor="middle">audio only</text>

  <!-- GROUP 4: text-only  .738 / .642 / .653 / .655 / .681 -->
  <rect x="565" y="111.9" width="26" height="228.1" fill="#2e7d32"/>
  <rect x="593" y="176.7" width="26" height="163.3" fill="#e0e0e0"/>
  <rect x="621" y="169.3" width="26" height="170.7" fill="#bdbdbd"/>
  <rect x="649" y="167.9" width="26" height="172.1" fill="#90caf9"/>
  <rect x="677" y="150.2" width="26" height="189.8" fill="#1565c0"/>
  <text x="634" y="360" font-size="12.5" fill="#333333" text-anchor="middle">text only</text>

  <!-- highlight the audio-only gain -->
  <g stroke="#c62828" stroke-width="1.6">
    <line x1="456" y1="230" x2="540" y2="230"/>
    <line x1="456" y1="230" x2="456" y2="272"/>
    <line x1="540" y1="230" x2="540" y2="242"/>
  </g>
  <text x="498" y="223" font-size="11" font-weight="600" fill="#c62828" text-anchor="middle">+0.045 over FedAvg</text>

  <text x="395" y="384" font-size="13" fill="#333333" text-anchor="middle">client modality-access pattern</text>

  <!-- legend -->
  <g font-size="11.5">
    <rect x="80" y="400" width="16" height="12" fill="#2e7d32"/><text x="102" y="411" fill="#555555">centralized</text>
    <rect x="185" y="400" width="16" height="12" fill="#e0e0e0"/><text x="207" y="411" fill="#555555">FedAvg</text>
    <rect x="275" y="400" width="16" height="12" fill="#bdbdbd"/><text x="297" y="411" fill="#555555">subgraph</text>
    <rect x="375" y="400" width="16" height="12" fill="#90caf9"/><text x="397" y="411" fill="#555555">subgraph + reputation</text>
    <rect x="545" y="400" width="16" height="12" fill="#1565c0"/><text x="567" y="411" fill="#555555">full framework</text>
  </g>
  <text x="80" y="432" font-size="11" fill="#666666">Source: experiments/phase4/phase4_federated_comparison_20260913_085150/federated_comparison.json</text>
</svg>
