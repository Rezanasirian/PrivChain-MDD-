<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="Vazirmatn, Tahoma, 'Segoe UI', sans-serif">
  <rect width="760" height="470" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" direction="rtl" font-size="16" font-weight="600" fill="#1a1a1a">مدل «رمزگذاری سپس همجوشی» و چهار گروه پارامتر حریم خصوصی آن</text>

  <!-- ورودی‌ها (سمت راست) -->
  <g font-size="11.5">
    <rect x="590" y="70" width="130" height="56" rx="5" fill="#fff8e1" stroke="#f9a825"/>
    <text x="655" y="90" text-anchor="middle" direction="rtl" font-weight="600" fill="#f57f17">صوت</text>
    <text x="655" y="107" text-anchor="middle" font-size="10.5" fill="#795548" direction="rtl">COVAREP، ۷۴ کانال</text>
    <text x="655" y="120" text-anchor="middle" direction="rtl" font-size="10.5" fill="#795548">فریم‌های حدود ۱۰ میلی‌ثانیه</text>

    <rect x="590" y="180" width="130" height="56" rx="5" fill="#fff8e1" stroke="#f9a825"/>
    <text x="655" y="200" text-anchor="middle" direction="rtl" font-weight="600" fill="#f57f17">ویدئو</text>
    <text x="655" y="217" text-anchor="middle" direction="rtl" font-size="10.5" fill="#795548">واحدهای حرکتی OpenFace</text>
    <text x="655" y="230" text-anchor="middle" direction="rtl" font-size="10.5" fill="#795548">+ پرچم موفقیت ردیابی</text>

    <rect x="590" y="290" width="130" height="56" rx="5" fill="#fff8e1" stroke="#f9a825"/>
    <text x="655" y="310" text-anchor="middle" direction="rtl" font-weight="600" fill="#f57f17">متن</text>
    <text x="655" y="327" text-anchor="middle" direction="rtl" font-size="10.5" fill="#795548">تعبیهٔ ترنسفورمر</text>
    <text x="655" y="340" text-anchor="middle" direction="rtl" font-size="10.5" fill="#795548">۷۶۸ بعدی</text>
  </g>

  <!-- تابعک‌ها -->
  <g font-size="10.5" fill="#555">
    <rect x="472" y="76" width="92" height="44" rx="4" fill="#ffffff" stroke="#bdbdbd" stroke-dasharray="3 2"/>
    <text x="518" y="94" text-anchor="middle" direction="rtl">تابعک‌ها</text>
    <text x="518" y="110" text-anchor="middle" direction="rtl">رابطهٔ (۳-۳)</text>

    <rect x="472" y="186" width="92" height="44" rx="4" fill="#ffffff" stroke="#bdbdbd" stroke-dasharray="3 2"/>
    <text x="518" y="204" text-anchor="middle" direction="rtl">تابعک‌ها</text>
    <text x="518" y="220" text-anchor="middle" direction="rtl">رابطهٔ (۳-۳)</text>

    <rect x="472" y="296" width="92" height="44" rx="4" fill="#ffffff" stroke="#bdbdbd" stroke-dasharray="3 2"/>
    <text x="518" y="314" text-anchor="middle" direction="rtl">میانگین ماسک‌شده</text>
    <text x="518" y="330" text-anchor="middle" direction="rtl">سطح جلسه</text>
  </g>

  <!-- رمزگذارها = گروه‌های ۱ تا ۳ -->
  <g>
    <rect x="296" y="70" width="150" height="56" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
    <text x="371" y="90" text-anchor="middle" direction="rtl" font-size="12.5" font-weight="600" fill="#b71c1c">رمزگذار صوت</text>
    <text x="371" y="108" text-anchor="middle" font-size="10.5" fill="#c62828" direction="ltr">σ = ۱۱٫۰۵ · ε = ۱٫۹۶</text>
    <text x="371" y="120" text-anchor="middle" direction="rtl" font-size="10" fill="#8d6e63">خطر ۱٫۰۰ (۲۲٫۲ برابر شانس)</text>

    <rect x="296" y="180" width="150" height="56" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
    <text x="371" y="200" text-anchor="middle" direction="rtl" font-size="12.5" font-weight="600" fill="#b71c1c">رمزگذار ویدئو</text>
    <text x="371" y="218" text-anchor="middle" font-size="10.5" fill="#c62828" direction="ltr">σ = ۱۰٫۷۵ · ε = ۲٫۰۲</text>
    <text x="371" y="230" text-anchor="middle" direction="rtl" font-size="10" fill="#8d6e63">خطر ۰٫۹۷ (۲۱٫۶ برابر شانس)</text>

    <rect x="296" y="290" width="150" height="56" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
    <text x="371" y="310" text-anchor="middle" direction="rtl" font-size="12.5" font-weight="600" fill="#e65100">رمزگذار متن</text>
    <text x="371" y="328" text-anchor="middle" font-size="10.5" fill="#ef6c00" direction="ltr">σ = ۳٫۰۷ · ε = ۶٫۷۵</text>
    <text x="371" y="340" text-anchor="middle" direction="rtl" font-size="10" fill="#8d6e63">خطر ۰٫۲۹ (۶٫۶ برابر شانس)</text>
  </g>

  <g font-size="10" fill="#1565c0">
    <text x="278" y="91" text-anchor="middle">z ∈ ℝ¹²⁸</text>
    <text x="265" y="201" text-anchor="middle">z ∈ ℝ¹²⁸</text>
    <text x="278" y="311" text-anchor="middle">z ∈ ℝ¹²⁸</text>
  </g>

  <!-- همجوشی + سر = گروه ۴ -->
  <rect x="50" y="150" width="180" height="116" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/>
  <text x="140" y="174" text-anchor="middle" direction="rtl" font-size="12.5" font-weight="600" fill="#1a237e">همجوشی + سرها</text>
  <text x="140" y="192" text-anchor="middle" direction="rtl" font-size="11.5" font-weight="600" fill="#1a237e">گروه مشترک</text>
  <text x="140" y="212" text-anchor="middle" direction="rtl" font-size="10.5" fill="#3949ab">الحاق ← MLP ← لاجیت</text>
  <text x="140" y="232" text-anchor="middle" direction="rtl" font-size="10.5" fill="#c62828">σ مشترک = بیشینهٔ σ وجوه</text>
  <text x="140" y="250" text-anchor="middle" direction="rtl" font-size="10" fill="#5c6bc0">رابطهٔ (۳-۸) — محافظه‌کارانه</text>

  <rect x="80" y="300" width="120" height="42" rx="5" fill="#ffffff" stroke="#1a237e"/>
  <text x="140" y="318" text-anchor="middle" font-size="12" font-weight="600" fill="#1a237e">ŷ : PHQ-8 ≥ ۱۰</text>
  <text x="140" y="334" text-anchor="middle" direction="rtl" font-size="10" fill="#5c6bc0">نمرهٔ دودویی افسردگی</text>

  <g stroke="#9e9e9e" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <line x1="590" y1="98" x2="568" y2="98"/><line x1="472" y1="98" x2="450" y2="98"/>
    <line x1="590" y1="208" x2="568" y2="208"/><line x1="472" y1="208" x2="450" y2="208"/>
    <line x1="590" y1="318" x2="568" y2="318"/><line x1="472" y1="318" x2="450" y2="318"/>
    <path d="M296,98 L255,98 L255,182 L234,182"/>
    <path d="M296,208 L234,208"/>
    <path d="M296,318 L255,318 L255,234 L234,234"/>
    <line x1="140" y1="266" x2="140" y2="296"/>
  </g>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#9e9e9e"/>
    </marker>
  </defs>

  <rect x="40" y="370" width="680" height="72" rx="6" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="704" y="392" direction="rtl" text-anchor="start" font-size="12" font-weight="600" fill="#b71c1c">چرا تضمین روی هر چهار گروه ترکیب می‌شود</text>
  <text x="704" y="412" direction="rtl" text-anchor="start" font-size="11.5" fill="#444444">هر سه رمزگذار از یک تابع زیان مشترک بهینه می‌شوند، پس تغییر رکورد صوتی یک شرکت‌کننده می‌تواند گرادیان</text>
  <text x="704" y="428" direction="rtl" text-anchor="start" font-size="11.5" fill="#444444">همهٔ گروه‌ها را جابه‌جا کند — نه فقط رمزگذار صوت. کران مدل منتشرشده، ε شرکت‌کننده در رابطهٔ (۳-۹) است، نه ε هر وجه.</text>

  <text x="720" y="462" font-size="11" fill="#666666" direction="rtl" text-anchor="start">مقادیر ε و σ مربوط به تخصیص تطبیقی بخش ۴-۲-۴ است که به بودجهٔ مشترک شرکت‌کنندهٔ ۸٫۰ مقیاس شده‌اند.</text>
</svg>
