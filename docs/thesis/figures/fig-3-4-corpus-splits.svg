<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" font-family="Vazirmatn, Tahoma, 'Segoe UI', sans-serif">
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="380" y="26" text-anchor="middle" direction="rtl" font-size="16" font-weight="600" fill="#1a1a1a">پیکره، توازن برچسب، و توزیع بخش آموزش میان کلاینت‌ها</text>

  <text x="700" y="64" font-size="13" font-weight="600" fill="#333" direction="rtl" text-anchor="start">بخش‌بندی رسمی AVEC2017‏؛ ۱۸۸ شرکت‌کننده (شرکت‌کنندهٔ ۴۴۰ کنار گذاشته شد)</text>

  <!-- train -->
  <text x="630" y="96" font-size="12" font-weight="600" fill="#1b5e20" text-anchor="middle" direction="rtl">train — ۱۰۷</text>
  <rect x="560" y="104" width="140" height="32" fill="#c8e6c9" stroke="#2e7d32"/>
  <rect x="659.4" y="104" width="40.6" height="32" fill="#2e7d32"/>
  <text x="680" y="125" font-size="11" fill="#ffffff" text-anchor="middle" direction="rtl">۳۱</text>
  <text x="610" y="125" font-size="11" fill="#1b5e20" text-anchor="middle" direction="rtl">۷۶</text>
  <text x="630" y="152" font-size="10.5" fill="#666" text-anchor="middle" direction="rtl">نرخ مثبت ۰٫۲۹</text>

  <!-- dev -->
  <text x="470" y="96" font-size="12" font-weight="600" fill="#0d47a1" text-anchor="middle" direction="rtl">dev — ۳۴</text>
  <rect x="414" y="104" width="112" height="32" fill="#bbdefb" stroke="#1565c0"/>
  <rect x="486.5" y="104" width="39.5" height="32" fill="#1565c0"/>
  <text x="506" y="125" font-size="11" fill="#ffffff" text-anchor="middle" direction="rtl">۱۲</text>
  <text x="450" y="125" font-size="11" fill="#0d47a1" text-anchor="middle" direction="rtl">۲۲</text>
  <text x="470" y="152" font-size="10.5" fill="#666" text-anchor="middle" direction="rtl">نرخ مثبت ۰٫۳۵</text>

  <!-- test -->
  <text x="310" y="96" font-size="12" font-weight="600" fill="#b71c1c" text-anchor="middle" direction="rtl">test رسمی — ۴۷</text>
  <rect x="240" y="104" width="140" height="32" fill="#ffcdd2" stroke="#c62828"/>
  <rect x="338.3" y="104" width="41.7" height="32" fill="#c62828"/>
  <text x="359" y="125" font-size="11" fill="#ffffff" text-anchor="middle" direction="rtl">۱۴</text>
  <text x="290" y="125" font-size="11" fill="#b71c1c" text-anchor="middle" direction="rtl">۳۳</text>
  <text x="310" y="152" font-size="10.5" fill="#666" text-anchor="middle" direction="rtl">نرخ مثبت ۰٫۳۰</text>

  <!-- راهنما -->
  <rect x="178" y="104" width="16" height="14" fill="#2e7d32"/>
  <text x="172" y="116" font-size="11" fill="#555" direction="rtl" text-anchor="start">افسرده (PHQ-8 ≥ ۱۰)</text>
  <rect x="178" y="124" width="16" height="14" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="172" y="136" font-size="11" fill="#555" direction="rtl" text-anchor="start">غیرافسرده</text>
  <text x="194" y="158" font-size="10.5" fill="#c62828" direction="rtl" text-anchor="start">به دلیل همین عدم توازن،</text>
  <text x="194" y="172" font-size="10.5" fill="#c62828" direction="rtl" text-anchor="start">macro-F1 کنار F1 گزارش می‌شود</text>

  <line x1="60" y1="188" x2="700" y2="188" stroke="#e0e0e0"/>

  <text x="700" y="212" font-size="13" font-weight="600" fill="#333" direction="rtl" text-anchor="start">۱۰۷ شرکت‌کنندهٔ آموزش میان ده کلاینت شبیه‌سازی‌شده با دسترسی ناهمگون به وجوه توزیع می‌شوند</text>

  <g font-size="11">
    <rect x="550" y="228" width="150" height="118" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="625" y="250" text-anchor="middle" direction="rtl" font-size="12" font-weight="600" fill="#1b5e20">کامل — [۱,۱,۱]</text>
    <text x="625" y="268" text-anchor="middle" direction="rtl" fill="#2e7d32">۴ کلاینت، حدود ۳۶ جلسه</text>
    <g fill="#66bb6a">
      <circle cx="580" cy="292" r="11"/><circle cx="610" cy="292" r="11"/><circle cx="640" cy="292" r="11"/><circle cx="670" cy="292" r="11"/>
    </g>
    <text x="625" y="326" text-anchor="middle" direction="rtl" font-size="10.5" fill="#555">در هر چهار گروه پارامتر</text>
    <text x="625" y="340" text-anchor="middle" direction="rtl" font-size="10.5" fill="#555">مشارکت می‌کند</text>

    <rect x="386" y="228" width="150" height="118" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
    <text x="461" y="250" text-anchor="middle" direction="rtl" font-size="12" font-weight="600" fill="#0d47a1">صوت+متن — [۱,۰,۱]</text>
    <text x="461" y="268" text-anchor="middle" direction="rtl" fill="#1565c0">۳ کلاینت، حدود ۲۶ جلسه</text>
    <g fill="#42a5f5">
      <circle cx="431" cy="292" r="11"/><circle cx="461" cy="292" r="11"/><circle cx="491" cy="292" r="11"/>
    </g>
    <text x="461" y="326" text-anchor="middle" direction="rtl" font-size="10.5" fill="#555">هرگز به رمزگذار ویدئو</text>
    <text x="461" y="340" text-anchor="middle" direction="rtl" font-size="10.5" fill="#555">دست نمی‌زند</text>

    <rect x="222" y="228" width="150" height="118" rx="6" fill="#fff3e0" stroke="#ef6c00"/>
    <text x="297" y="250" text-anchor="middle" direction="rtl" font-size="12" font-weight="600" fill="#e65100">فقط صوت — [۱,۰,۰]</text>
    <text x="297" y="268" text-anchor="middle" direction="rtl" fill="#ef6c00">۲ کلاینت، حدود ۱۷ جلسه</text>
    <g fill="#ffa726">
      <circle cx="282" cy="292" r="11"/><circle cx="312" cy="292" r="11"/>
    </g>
    <text x="297" y="326" text-anchor="middle" direction="rtl" font-size="10.5" font-weight="600" fill="#c62828">گروه هدف تقطیر</text>
    <text x="297" y="340" text-anchor="middle" direction="rtl" font-size="10.5" font-weight="600" fill="#c62828">بین‌وجهی</text>

    <rect x="60" y="228" width="148" height="118" rx="6" fill="#f3e5f5" stroke="#8e24aa"/>
    <text x="134" y="250" text-anchor="middle" direction="rtl" font-size="12" font-weight="600" fill="#6a1b9a">فقط متن — [۰,۰,۱]</text>
    <text x="134" y="268" text-anchor="middle" direction="rtl" fill="#8e24aa">۱ کلاینت، حدود ۸ جلسه</text>
    <g fill="#ab47bc">
      <circle cx="134" cy="292" r="11"/>
    </g>
    <text x="134" y="326" text-anchor="middle" direction="rtl" font-size="10.5" fill="#555">برای سازوکار صوت یا ویدئو</text>
    <text x="134" y="340" text-anchor="middle" direction="rtl" font-size="10.5" fill="#555">هیچ σ گزارش نمی‌کند</text>
  </g>

  <rect x="60" y="362" width="640" height="58" rx="6" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="684" y="382" font-size="11.5" fill="#444" direction="rtl" text-anchor="start"><tspan font-weight="600">یک انتخاب طراحی است، نه یک مشاهده.</tspan> این توزیع ناهمگونی توصیف‌شده در بخش ۱-۳ را مدل می‌کند — اپلیکیشنی</text>
  <text x="684" y="399" font-size="11.5" fill="#444" direction="rtl" text-anchor="start">بدون پهنای باند ویدئو، بخشی بدون رونوشت ساختاریافته، مددکاری فقط با یادداشت. این یک پارامتر شبیه‌سازی است</text>
  <text x="684" y="414" font-size="11.5" fill="#444" direction="rtl" text-anchor="start">و در محدودیت‌های بخش ۵-۲-۴ فهرست شده است.</text>
</svg>
