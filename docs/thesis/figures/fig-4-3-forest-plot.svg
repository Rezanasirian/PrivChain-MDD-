<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" font-family="Vazirmatn, Tahoma, 'Segoe UI', sans-serif">
  <rect width="760" height="450" fill="#ffffff"/>

  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a" direction="rtl">اختلاف‌های جفتی سطح شرکت‌کننده روی بخش آزمون رسمی</text>
  <text x="380" y="48" text-anchor="middle" font-size="12" fill="#666666" direction="rtl">۴۷ شرکت‌کننده (۱۴ مثبت)؛ امتیاز هر فرد پیش از بازنمونه‌گیری روی ۳ seed میانگین گرفته شده است</text>

  <!-- محور: −۰٫۱۰ در x=۱۳۰ تا +۰٫۳۵ در x=۵۶۰ ؛ صفر در x=۲۲۵٫۶ -->
  <line x1="130" y1="360" x2="560" y2="360" stroke="#cccccc" stroke-width="1"/>
  <g stroke="#eeeeee" stroke-width="1">
    <line x1="130" y1="70" x2="130" y2="360"/>
    <line x1="321.1" y1="70" x2="321.1" y2="360"/>
    <line x1="416.7" y1="70" x2="416.7" y2="360"/>
    <line x1="512.2" y1="70" x2="512.2" y2="360"/>
  </g>
  <g font-size="12" fill="#555555" text-anchor="middle">
    <text x="130" y="380">−۰٫۱۰</text>
    <text x="225.6" y="380">۰٫۰۰</text>
    <text x="321.1" y="380">+۰٫۱۰</text>
    <text x="416.7" y="380">+۰٫۲۰</text>
    <text x="512.2" y="380">+۰٫۳۰</text>
  </g>
  <text x="345" y="402" font-size="13" fill="#333333" text-anchor="middle" direction="rtl">Δ ROC-AUC (بازهٔ اطمینان ۹۵٪ بوت‌استرپ)</text>

  <line x1="225.6" y1="70" x2="225.6" y2="360" stroke="#c62828" stroke-width="1.8" stroke-dasharray="6 4"/>

  <!-- ستون برچسب در راست (x=۷۴۰)، ستون مقدار در چپ (x=۱۱۸) -->

  <!-- ۱ -->
  <text x="740" y="95" font-size="12.5" fill="#222222" direction="rtl" text-anchor="start">متمرکز − FedAvg</text>
  <line x1="341.2" y1="90" x2="560" y2="90" stroke="#2e7d32" stroke-width="2"/>
  <line x1="341.2" y1="84" x2="341.2" y2="96" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="511.3" cy="90" r="5" fill="#2e7d32"/>
  <text x="118" y="94" font-size="11.5" font-weight="600" fill="#2e7d32" text-anchor="end">+۰٫۲۹۹</text>

  <!-- ۲ -->
  <text x="740" y="135" font-size="12.5" fill="#222222" direction="rtl" text-anchor="start">متمرکز − شخصی‌سازی‌شده</text>
  <line x1="309.7" y1="130" x2="560" y2="130" stroke="#2e7d32" stroke-width="2"/>
  <line x1="309.7" y1="124" x2="309.7" y2="136" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="461.6" cy="130" r="5" fill="#2e7d32"/>
  <text x="118" y="134" font-size="11.5" font-weight="600" fill="#2e7d32" text-anchor="end">+۰٫۲۴۷</text>

  <!-- ۳ -->
  <text x="740" y="175" font-size="12.5" font-weight="600" fill="#222222" direction="rtl" text-anchor="start">پیشنهادی − FedAvg</text>
  <line x1="324" y1="170" x2="515.1" y2="170" stroke="#1565c0" stroke-width="2.4"/>
  <line x1="324" y1="163" x2="324" y2="177" stroke="#1565c0" stroke-width="2.4"/>
  <line x1="515.1" y1="163" x2="515.1" y2="177" stroke="#1565c0" stroke-width="2.4"/>
  <circle cx="410" cy="170" r="6" fill="#1565c0"/>
  <text x="118" y="174" font-size="11.5" font-weight="600" fill="#1565c0" text-anchor="end">+۰٫۱۹۳</text>

  <!-- ۴ -->
  <text x="740" y="215" font-size="12.5" fill="#222222" direction="rtl" text-anchor="start">پیشنهادی − شخصی‌سازی‌شده</text>
  <line x1="293.4" y1="210" x2="441.5" y2="210" stroke="#1565c0" stroke-width="2"/>
  <line x1="293.4" y1="204" x2="293.4" y2="216" stroke="#1565c0" stroke-width="2"/>
  <line x1="441.5" y1="204" x2="441.5" y2="216" stroke="#1565c0" stroke-width="2"/>
  <circle cx="360.3" cy="210" r="5" fill="#1565c0"/>
  <text x="118" y="214" font-size="11.5" font-weight="600" fill="#1565c0" text-anchor="end">+۰٫۱۴۱</text>

  <!-- ۵ -->
  <text x="740" y="255" font-size="12.5" font-weight="600" fill="#222222" direction="rtl" text-anchor="start">متمرکز − پیشنهادی</text>
  <line x1="192.1" y1="250" x2="462.5" y2="250" stroke="#ef6c00" stroke-width="2.4"/>
  <line x1="192.1" y1="243" x2="192.1" y2="257" stroke="#ef6c00" stroke-width="2.4"/>
  <line x1="462.5" y1="243" x2="462.5" y2="257" stroke="#ef6c00" stroke-width="2.4"/>
  <circle cx="326.9" cy="250" r="6" fill="#ffffff" stroke="#ef6c00" stroke-width="2.6"/>
  <text x="118" y="254" font-size="11.5" font-weight="600" fill="#ef6c00" text-anchor="end">+۰٫۱۰۶</text>

  <!-- ۶ -->
  <text x="740" y="295" font-size="12.5" fill="#222222" direction="rtl" text-anchor="start">پیشنهادی − پیشنهادی بدون شهرت</text>
  <line x1="227.5" y1="290" x2="261.9" y2="290" stroke="#1565c0" stroke-width="2"/>
  <line x1="227.5" y1="284" x2="227.5" y2="296" stroke="#1565c0" stroke-width="2"/>
  <line x1="261.9" y1="284" x2="261.9" y2="296" stroke="#1565c0" stroke-width="2"/>
  <circle cx="241.8" cy="290" r="5" fill="#1565c0"/>
  <text x="118" y="294" font-size="11.5" font-weight="600" fill="#1565c0" text-anchor="end">+۰٫۰۱۷</text>

  <!-- ۷ -->
  <text x="740" y="335" font-size="12.5" fill="#222222" direction="rtl" text-anchor="start">DP تطبیقی − DP یکنواخت</text>
  <line x1="160" y1="330" x2="308.1" y2="330" stroke="#9e9e9e" stroke-width="2"/>
  <line x1="160" y1="324" x2="160" y2="336" stroke="#9e9e9e" stroke-width="2"/>
  <line x1="308.1" y1="324" x2="308.1" y2="336" stroke="#9e9e9e" stroke-width="2"/>
  <circle cx="228.8" cy="330" r="5" fill="#ffffff" stroke="#9e9e9e" stroke-width="2.4"/>
  <text x="118" y="334" font-size="11.5" fill="#9e9e9e" text-anchor="end">+۰٫۰۰۸</text>

  <text x="560" y="66" font-size="10.5" fill="#888888" direction="rtl" text-anchor="start">ردیف‌های ۱ و ۲: کران بالای بازه از محور خارج می‌شود</text>

  <!-- راهنما -->
  <circle cx="740" cy="428" r="5" fill="#1565c0"/>
  <text x="730" y="432" font-size="11.5" fill="#555555" direction="rtl" text-anchor="start">بازه صفر را حذف می‌کند (معنادار)</text>
  <circle cx="500" cy="428" r="5" fill="#ffffff" stroke="#ef6c00" stroke-width="2.4"/>
  <text x="490" y="432" font-size="11.5" fill="#555555" direction="rtl" text-anchor="start">بازه شامل صفر است (معنادار نیست)</text>
  <text x="118" y="444" font-size="10.5" fill="#666666" text-anchor="end" direction="rtl">منبع: official_test_paired.json و allocation_comparison.json</text>
</svg>
