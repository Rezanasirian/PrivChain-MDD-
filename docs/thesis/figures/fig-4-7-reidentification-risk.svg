<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" font-family="Vazirmatn, Tahoma, 'Segoe UI', sans-serif">
  <rect width="760" height="450" fill="#ffffff"/>
  <text x="380" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a" direction="rtl">خطر بازشناسایی هویت هر وجه داده (۱۴۱ شرکت‌کننده، ۳ seed)</text>
  <text x="380" y="45" text-anchor="middle" font-size="11.5" fill="#666666" direction="rtl">حمله‌کنندهٔ نزدیک‌ترین مرکز با عرض ویژگی همسان، شش بازهٔ مجزا درون هر جلسه</text>

  <!-- محور: ۰٫۰۰ در x=۶۶۰ تا ۰٫۲۰ در x=۱۷۰ (راست به چپ) -->
  <g stroke="#cccccc" stroke-width="1">
    <line x1="660" y1="80" x2="660" y2="330"/>
    <line x1="170" y1="330" x2="660" y2="330"/>
  </g>
  <g stroke="#eeeeee" stroke-width="1">
    <line x1="537.5" y1="80" x2="537.5" y2="330"/>
    <line x1="415" y1="80" x2="415" y2="330"/>
    <line x1="292.5" y1="80" x2="292.5" y2="330"/>
    <line x1="170" y1="80" x2="170" y2="330"/>
  </g>
  <g font-size="12" fill="#555555" text-anchor="middle">
    <text x="660" y="350">۰٫۰۰</text>
    <text x="537.5" y="350">۰٫۰۵</text>
    <text x="415" y="350">۰٫۱۰</text>
    <text x="292.5" y="350">۰٫۱۵</text>
    <text x="170" y="350">۰٫۲۰</text>
  </g>
  <text x="415" y="374" font-size="13" fill="#333" text-anchor="middle" direction="rtl">نرخ بازشناسایی درست</text>

  <!-- خط شانس -->
  <line x1="642.6" y1="80" x2="642.6" y2="330" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="636" y="94" font-size="11" font-weight="600" fill="#c62828" direction="rtl" text-anchor="start">شانس = ۱/۱۴۱ = ۰٫۰۰۷۱</text>

  <!-- صوت -->
  <text x="700" y="128" font-size="13" font-weight="600" fill="#222" direction="rtl" text-anchor="start">صوت</text>
  <rect x="272.9" y="110" width="387.1" height="28" fill="#c62828"/>
  <g stroke="#7f0000" stroke-width="1.6">
    <line x1="263.1" y1="124" x2="282.7" y2="124"/><line x1="263.1" y1="118" x2="263.1" y2="130"/><line x1="282.7" y1="118" x2="282.7" y2="130"/>
  </g>
  <text x="252" y="128" font-size="12" font-weight="600" fill="#c62828" direction="rtl" text-anchor="start">۰٫۱۵۸ — ۲۲٫۲ برابر شانس</text>
  <text x="700" y="146" font-size="10.5" fill="#888" direction="rtl" text-anchor="start">خطر نرمال‌شده ۱٫۰۰</text>

  <!-- ویدئو -->
  <text x="700" y="180" font-size="13" font-weight="600" fill="#222" direction="rtl" text-anchor="start">ویدئو</text>
  <rect x="285.1" y="162" width="374.9" height="28" fill="#ef5350"/>
  <g stroke="#7f0000" stroke-width="1.6">
    <line x1="260.6" y1="176" x2="309.6" y2="176"/><line x1="260.6" y1="170" x2="260.6" y2="182"/><line x1="309.6" y1="170" x2="309.6" y2="182"/>
  </g>
  <text x="250" y="180" font-size="12" font-weight="600" fill="#c62828" direction="rtl" text-anchor="start">۰٫۱۵۳ — ۲۱٫۶ برابر شانس</text>
  <text x="700" y="198" font-size="10.5" fill="#888" direction="rtl" text-anchor="start">خطر نرمال‌شده ۰٫۹۷</text>

  <!-- متن -->
  <text x="700" y="232" font-size="13" font-weight="600" fill="#222" direction="rtl" text-anchor="start">متن</text>
  <rect x="547.3" y="214" width="112.7" height="28" fill="#ef6c00"/>
  <g stroke="#e65100" stroke-width="1.6">
    <line x1="537.5" y1="228" x2="557.1" y2="228"/><line x1="537.5" y1="222" x2="537.5" y2="234"/><line x1="557.1" y1="222" x2="557.1" y2="234"/>
  </g>
  <text x="528" y="232" font-size="12" font-weight="600" fill="#ef6c00" direction="rtl" text-anchor="start">۰٫۰۴۶ — ۶٫۶ برابر شانس</text>
  <text x="700" y="250" font-size="10.5" fill="#888" direction="rtl" text-anchor="start">خطر نرمال‌شده ۰٫۲۹</text>

  <!-- شاهد منفی -->
  <text x="700" y="290" font-size="13" font-weight="600" fill="#555" direction="rtl" text-anchor="start">شاهد</text>
  <rect x="642.6" y="272" width="17.4" height="28" fill="#9e9e9e"/>
  <text x="634" y="290" font-size="12" fill="#666" direction="rtl" text-anchor="start">۰٫۰۰۲۴ تا ۰٫۰۰۷۱ — دقیقاً روی شانس</text>
  <text x="700" y="308" font-size="10.5" fill="#888" direction="rtl" text-anchor="start">برچسب درهم‌ریخته</text>

  <!-- براکت تفکیک‌ناپذیری -->
  <g stroke="#1565c0" stroke-width="1.6">
    <line x1="120" y1="112" x2="104" y2="112"/>
    <line x1="104" y1="112" x2="104" y2="188"/>
    <line x1="120" y1="188" x2="104" y2="188"/>
  </g>
  <text x="94" y="154" font-size="11" font-weight="600" fill="#1565c0" text-anchor="middle" direction="rtl" transform="rotate(-90 94 154)">تفکیک‌ناپذیر</text>

  <rect x="60" y="388" width="640" height="52" rx="6" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="684" y="408" font-size="11.5" fill="#444" direction="rtl" text-anchor="start"><tspan font-weight="600">تصحیح نسبت به فصل ۱.</tspan> مقادیر فرض‌شدهٔ ۰٫۹ / ۰٫۶ / ۰٫۳ میان صوت و ویدئو تفکیک ۱٫۵ برابری قائل می‌شدند که</text>
  <text x="684" y="425" font-size="11.5" fill="#444" direction="rtl" text-anchor="start">داده آن را پشتیبانی نمی‌کند؛ تنها متن به‌روشنی کم‌خطرتر است. تخصیص رابطهٔ (۳-۵) از همین مقادیر اندازه‌گیری‌شده مشتق می‌شود.</text>
</svg>
